<style>
:root{--w:#f9f0df;--wr:249,240,223;--red:#e2472b;--redL:#f2603f;--fanC:#ffe7a0;--fanO:#190b04;--hr:34,16,4;--ui:#f9f0df;--uir:249,240,223;--bar:#1a0f07;
  --serif:"S","Songti SC","STSong","Hiragino Mincho ProN","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC",serif}
html,body{margin:0;padding:0;height:100%;background:var(--bar);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--serif);font-weight:700;color:var(--w);touch-action:none}
#probe{position:fixed;left:0;top:0;width:0;height:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
#film{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;background:#2a1c12;touch-action:none}
#bgw{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
#bgm{position:absolute;left:0;top:0;width:100%;height:100%;-webkit-transform-origin:50% 50%;transform-origin:50% 50%;will-change:transform}
.bgi{position:absolute;left:0;top:0;width:100%;height:100%;display:block;object-fit:cover;object-position:50% 50%;-webkit-user-drag:none;visibility:hidden}
#dim{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;opacity:0;will-change:opacity}
#blk{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;opacity:0;pointer-events:none;will-change:opacity}
#pic{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
#fx,#fxT{position:absolute;left:0;top:0;pointer-events:none;visibility:hidden}
#cast{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0}
.ch{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none}
.ch.on{visibility:visible}
.bd{position:absolute;left:0;top:0;width:0;height:0;-webkit-transform-origin:0 0;transform-origin:0 0;will-change:transform}
.bd img{position:absolute;display:block;max-width:none;visibility:hidden;-webkit-user-drag:none}
.ch.on .bd img.p{visibility:visible}
.bd canvas{position:absolute;display:block;visibility:hidden}
.ch.on .bd canvas.p{visibility:visible}
.bd canvas.fo{z-index:2}
.ch.on .bd canvas.fo.v{visibility:visible}
.sd{position:absolute;display:block;border-radius:50%;background:radial-gradient(closest-side,rgba(26,10,0,.55) 0%,rgba(26,10,0,.34) 42%,rgba(26,10,0,0) 100%)}
#texts{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}
#tap{position:absolute;left:0;top:0;width:100%;height:100%;z-index:2;touch-action:none}
#hots{position:absolute;left:0;top:0;width:100%;height:100%;z-index:3;pointer-events:none}
#vig{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4;background:radial-gradient(ellipse 92% 76% at 50% 50%,rgba(0,0,0,0) 56%,rgba(36,16,2,.2) 100%)}
#flash{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:0;background:#fbf3e2;z-index:4}
#fadeS{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;opacity:0;pointer-events:none;z-index:4;will-change:opacity}
#ui{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:7}
button{font-family:inherit;font-weight:inherit;-webkit-appearance:none;appearance:none;border:0;margin:0;padding:0;background:none;color:inherit;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
/* everyone talks in a bubble beside them: white, round, a little tail, the name small inside. It waits for her tap */
.say{position:absolute;left:0;top:0;box-sizing:border-box;padding:.44em .78em .6em;line-height:1.36;letter-spacing:.02em;color:#2a1c12;background:#fffdf6;border-radius:18px;box-shadow:0 8px 20px -8px rgba(30,14,2,.6),0 0 0 1.5px rgba(50,28,10,.16);white-space:normal;word-break:break-all;will-change:transform,opacity}
.say b{display:block;font-size:.66em;line-height:1.1;margin-bottom:.26em;color:#a2482a;letter-spacing:.1em;font-weight:700}
.say .tl{position:absolute;display:block;width:14px;height:14px;background:#fffdf6;-webkit-transform:rotate(45deg);transform:rotate(45deg);border-radius:2px;pointer-events:none}
/* only the fake rerun of the video keeps the video's red tag and warm line */
.vid{position:absolute;left:0;top:0;line-height:1.5;letter-spacing:.04em;color:var(--fanC);white-space:normal;word-break:break-all;text-shadow:1px 1px 0 var(--fanO),-1px -1px 0 var(--fanO),1px -1px 0 var(--fanO),-1px 1px 0 var(--fanO),0 2px 10px rgba(20,8,0,.6);will-change:transform,opacity}
.vid b{display:inline-block;font-size:.66em;line-height:1;padding:.34em .55em .3em;margin-bottom:.32em;background:var(--red);color:#140e0b;letter-spacing:.16em;text-shadow:none}
/* the little arrow that says: tap */
#more{position:absolute;left:0;top:0;width:0;height:0;border-style:solid;border-width:9px 7px 0 7px;border-color:#b5492b transparent transparent transparent;pointer-events:none;z-index:1;opacity:0;will-change:transform,opacity}
#more.big{border-width:12px 9px 0 9px;border-color:#fff4d8 transparent transparent transparent;-webkit-filter:drop-shadow(0 1px 2px rgba(0,0,0,.8));filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
/* a poke: one small word, gone at once */
.pw{position:absolute;left:0;top:0;white-space:nowrap;font-size:19px;line-height:1;color:#fff8e6;text-shadow:0 1px 3px rgba(20,8,0,.85),0 0 1px rgba(20,8,0,.9);pointer-events:none;will-change:transform,opacity}
.note{position:absolute;left:0;top:0;box-sizing:border-box;line-height:1.4;letter-spacing:.02em;color:#1c1915;background:#f7efdd;border:1.5px solid #8a6a44;border-radius:4px;padding:.44em .74em .62em;box-shadow:0 8px 18px -8px rgba(20,8,0,.7);white-space:normal;word-break:break-all;will-change:transform,opacity}
.note b{display:block;font-size:.66em;line-height:1.1;margin:0 0 .26em;color:#a2482a;letter-spacing:.1em;font-weight:700}
.signT{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.26;letter-spacing:.02em;color:#1c1915;box-sizing:border-box;word-break:break-all;will-change:transform,opacity}
.big{position:absolute;left:0;top:0;white-space:nowrap;color:var(--w);text-shadow:0 0 16px rgba(var(--hr),.62),0 0 4px rgba(var(--hr),.4);will-change:transform,opacity}
/* a tappable thing inside the picture */
.hot{position:absolute;left:0;top:0;pointer-events:auto;display:block;background:none;will-change:transform}
/* doors on the counter screen */
.door{position:absolute;left:0;top:0;pointer-events:auto;display:block;background:none;will-change:transform}
.tag{position:absolute;left:0;top:0;white-space:nowrap;text-align:center;line-height:1;color:#2b1809;background:linear-gradient(180deg,#e0b67c 0%,#c99a5e 58%,#b5844a 100%);border:2px solid #4c2f15;border-radius:4px;padding:.54em .66em .46em;letter-spacing:.1em;text-shadow:0 1px 0 rgba(255,236,200,.55);box-shadow:0 6px 10px -3px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,240,210,.5);will-change:transform,opacity}
.tag:before,.tag:after{content:"";position:absolute;top:-13px;width:2px;height:13px;background:#3a2412}.tag:before{left:18%;-webkit-transform:rotate(10deg);transform:rotate(10deg)}.tag:after{right:18%;-webkit-transform:rotate(-10deg);transform:rotate(-10deg)}
.tag i{display:block;font-style:normal;font-size:.72em;margin-top:.42em;letter-spacing:.1em;color:#fff4e0;background:#b5331c;padding:.28em .4em .24em;text-shadow:none}
.tag u{display:block;text-decoration:none;margin-top:.42em;height:.42em;line-height:0;letter-spacing:0}
.tag u s{display:inline-block;width:.36em;height:.36em;margin:0 .1em;border-radius:50%;background:rgba(58,36,18,.26);text-decoration:none}
.tag u s.on{background:#3a2412}
/* the board painted over the shop's blank sign */
.brd{position:absolute;left:0;top:0;white-space:nowrap;color:#3f220e;font-weight:700;letter-spacing:.1em;text-shadow:0 1px 0 rgba(255,214,160,.42);will-change:transform,opacity}
/* grey card of the opening */
.nx{position:absolute;left:0;top:0;box-sizing:border-box;text-align:center;will-change:transform,opacity;pointer-events:none}
.nx.g{border:1px solid rgba(var(--wr),.34);background:rgba(16,12,8,.62);color:rgba(var(--wr),.56)}
.nx.l{border:1px solid rgba(var(--wr),.9);background:rgba(var(--wr),.07);color:var(--w)}
.nx b{display:block;font-weight:700;letter-spacing:.3em;padding-left:.3em;line-height:1.3}
.nx span{display:block;letter-spacing:.04em;line-height:1.3}
.nx em{position:absolute;width:11px;height:11px;border:0 solid var(--ui);font-style:normal}
.nx em.c1{left:-1px;top:-1px;border-width:1.5px 0 0 1.5px}.nx em.c2{right:-1px;bottom:-1px;border-width:0 1.5px 1.5px 0}
/* top and bottom bars */
#toHub,#skipOp,#backB,#corner{position:absolute;height:44px;line-height:44px;color:rgba(var(--uir),.92);pointer-events:auto;visibility:hidden;white-space:nowrap;letter-spacing:.1em;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.55)}
#toHub{left:6px;padding:0 10px 0 22px}
#toHub:before{content:"";position:absolute;left:10px;top:50%;width:7px;height:7px;margin-top:-4px;border:solid rgba(var(--uir),.82);border-width:0 0 1.5px 1.5px;-webkit-transform:rotate(45deg);transform:rotate(45deg)}
#skipOp{right:54px;padding:0 10px;color:rgba(var(--uir),.86);font-size:13px}
#backB{left:6px;padding:0 10px;color:rgba(var(--uir),.88)}
#corner{right:6px;padding:0 10px;color:rgba(var(--uir),.78);font-size:12px}
#mute{position:absolute;right:8px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:rgba(var(--uir),.9);pointer-events:auto;-webkit-filter:drop-shadow(0 1px 2px rgba(0,0,0,.9));filter:drop-shadow(0 1px 2px rgba(0,0,0,.9))}
#mute svg{width:18px;height:18px}
#mute .off{display:none}#mute.muted .on{display:none}#mute.muted .off{display:block}
#dots{position:absolute;left:50%;height:44px;display:flex;pointer-events:none;visibility:hidden}
#dots button{width:26px;height:44px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#dots button i{display:block;width:7px;height:7px;border-radius:50%;background:rgba(var(--uir),.38);box-shadow:0 0 3px rgba(0,0,0,.7)}
#dots button.done i{background:rgba(var(--uir),.82)}
#dots button.cur i{background:none;border:1.5px solid var(--ui);box-sizing:border-box;width:9px;height:9px}
#dots button[disabled]{cursor:default}
/* word buttons */
#opts{position:absolute;left:0;width:100%;bottom:0;visibility:hidden;text-align:center;pointer-events:none}
